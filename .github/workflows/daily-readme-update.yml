name: Daily README timestamp

on:
  schedule:
    # Runs at 09:00 UTC every day
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp in README
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed -i "s|Last updated: .*|Last updated: ${TIMESTAMP}|" README.md

      - name: Commit and push
        run: |
          git config user.name "Kante560"
          git config user.email "187773505+Kante560@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: update README timestamp"
          git push
